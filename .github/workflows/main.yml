# Unofficial build train for the joi-button branch (PR Xinrea/bili-shadowreplay#293).
#
# This file lives ONLY on `unofficial/joi-button-build` and is deliberately kept
# off the PR branch, so the pull request carries no CI changes. It differs from
# upstream's Release workflow in three places, all marked UNOFFICIAL below:
# the platform matrix, the trigger, and the release metadata.
name: Unofficial Release (joi-button)
on:
  push:
    tags:
      # UNOFFICIAL: upstream matches "v*". Narrowed so a plain upstream tag
      # sitting in this fork can never start this train by accident.
      - "v*-joi-button.*"
jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "macos-latest" # for Apple silicon macs.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          # UNOFFICIAL: only macOS and Windows installers were asked for, so the
          # ubuntu-22.04 and windows-2022 CUDA legs are dropped. The CUDA leg is
          # the expensive one (CUDA toolkit + a whisper.cpp CUDA compile).
          - platform: "windows-latest"
            args: ""
            features: "cpu"
            target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set build type
        id: build_type
        run: |
          if [[ "${{ github.ref }}" == *"rc"* ]]; then
            echo "debug=true" >> $GITHUB_OUTPUT
          else
            echo "debug=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "yarn" # Set this to npm, yarn or pnpm.

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install CUDA toolkit (Windows CUDA only)
        if: matrix.features == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.24

      - name: Configure CUDA CMake generator (Windows CUDA only)
        if: matrix.features == 'cuda'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }

          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          $nvcc = Join-Path $cudaBin "nvcc.exe"
          if (-not (Test-Path $nvcc)) {
            throw "nvcc.exe not found at $nvcc"
          }

          $env:PATH = "$cudaBin;$env:PATH"
          $cudaBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDACXX=$nvcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          ninja --version
          & $nvcc --version

      - name: Setup ffmpeg
        if: runner.os == 'Windows'
        working-directory: ./
        shell: pwsh
        # running script ffmpeg_setup.ps1 to install ffmpeg on windows.
        # This script is located in the root of the repository.
        run: ./ffmpeg_setup.ps1

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: yarn install # change this to npm or pnpm depending on which one you use.

      - name: Copy CUDA DLLs (Windows CUDA only)
        if: matrix.features == 'cuda'
        shell: pwsh
        run: |
          $cudaPath = "$env:CUDA_PATH\bin"
          $targetPath = "src-tauri/windows-runtime"
          New-Item -ItemType Directory -Force -Path $targetPath
          Copy-Item "$cudaPath\cudart64*.dll" -Destination $targetPath
          Copy-Item "$cudaPath\cublas64*.dll" -Destination $targetPath
          Copy-Item "$cudaPath\cublasLt64*.dll" -Destination $targetPath

      - name: Get previous tag
        id: get_previous_tag
        run: |
          # Get the previous tag (excluding the current one being pushed)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            # If no previous tag found, use the first commit
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD | head -1)
          fi
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "current_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_OSX_DEPLOYMENT_TARGET: "13.3"
          CMAKE_CUDA_ARCHITECTURES: "75"
          WHISPER_BACKEND: ${{ matrix.features }}
          # Sentry DSN baked into the binary at build time (option_env! in main.rs).
          # When unset, Sentry is disabled in the build instead of using a default.
          SENTRY_ENDPOINT: ${{ secrets.SENTRY_ENDPOINT }}
        with:
          # UNOFFICIAL: attach to the tag that triggered this run rather than
          # deriving v__VERSION__ from package.json — that would resolve to
          # v2.21.0, which already exists in this fork and points at upstream's
          # release commit (960f5c2), not at this branch.
          tagName: ${{ github.ref_name }}
          releaseName: "非官方构建 · 轴伊按钮投稿 (${{ github.ref_name }})"
          releaseBody: "> [!WARNING]\n> 这是**非官方构建**，由 [Xinrea/bili-shadowreplay#293](https://github.com/Xinrea/bili-shadowreplay/pull/293) 的分支打包，**不是上游发布**，上游不对它负责。官方版本请到 [Xinrea/bili-shadowreplay/releases](https://github.com/Xinrea/bili-shadowreplay/releases) 下载。\n\n## 这个构建是什么\n\n上游 v2.21.0（`960f5c2`）之上加了两个提交，内容是「轴伊按钮账号」类型与「投稿切片到轴伊按钮站点」。除此之外与上游 v2.21.0 一致。\n\n## 装哪个\n\n| 平台 | 文件 |\n| --- | --- |\n| macOS Apple Silicon | `bili-shadowreplay_2.21.0_aarch64.dmg` |\n| macOS Intel | `bili-shadowreplay_2.21.0_x64.dmg` |\n| Windows | `bili-shadowreplay-cpu_2.21.0_x64-setup.exe`（或 `.msi`） |\n\n不含 Linux 与 Windows CUDA 版本。**文件名里的版本号与上游 v2.21.0 完全相同**——应用版本确实还是 2.21.0，请靠下载来源区分，别把它和官方包混在一个目录里。\n\n## 这些包没有签名\n\n**macOS**：首次打开会被 Gatekeeper 拦下，提示「已损坏，无法打开」或「无法验证开发者」。装好后在终端执行一次：\n\n```\nxattr -cr /Applications/bili-shadowreplay.app\n```\n\n**Windows**：SmartScreen 会弹「Windows 已保护你的电脑」，点「更多信息」再点「仍要运行」。\n\n## 首次使用\n\n环境准备参考上游的 [安装准备](https://bsr.xinrea.cn/getting-started/installation/desktop.html)。轴伊按钮功能的用法见仓库内 `docs/usage/features/joi-button.md`：**账号 → 添加账号 → 轴伊按钮**，填入自托管站点地址完成弹幕口令验证，之后在任意切片的**快速投稿**里选「轴伊按钮」。"
          # UNOFFICIAL: upstream publishes a non-prerelease draft for a human to
          # review and release. This one goes out directly and stays flagged as
          # a prerelease, so GitHub never serves it as this fork's "latest".
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }} ${{ matrix.features == 'cuda' && '--config src-tauri/tauri.windows.cuda.conf.json' || '' }}

      - name: Generate dSYM for Sentry (macOS only)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Rust on macOS keeps DWARF in the object files; run dsymutil to
          # produce a .dSYM bundle next to the binary so Sentry can symbolicate.
          BIN="src-tauri/target/$RUST_TARGET/release/bili-shadowreplay"
          if [ -f "$BIN" ]; then
            echo "Running dsymutil on $BIN"
            dsymutil "$BIN"
          else
            echo "Binary not found, skipping dsymutil: $BIN"
          fi

      - name: Upload debug symbols to Sentry
        # Requires repository secrets: SENTRY_URL, SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT
        continue-on-error: true
        shell: bash
        env:
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN not set, skipping debug symbol upload."
            exit 0
          fi
          # Use the explicit target triple from the matrix to locate the build output.
          if [ -n "$RUST_TARGET" ]; then
            DEBUG_DIR="src-tauri/target/$RUST_TARGET/release"
          else
            DEBUG_DIR="src-tauri/target/release"
          fi
          echo "Uploading debug files from: $DEBUG_DIR"
          npx --yes @sentry/cli@2 debug-files upload --include-sources "$DEBUG_DIR"
